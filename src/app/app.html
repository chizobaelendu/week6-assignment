<!-- App component is the root component through which everyother component and code are displayed. -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Young Researcher Academy — Interactive Website Prototype</title>
</head>

<body>
  <!-- Application layout (structure) -->
  <div ngClass="app">
    <app-navbar />
    <!-- Use router-outlet to hold the component of the current route (path).  -->
    <!-- router-outlet is a container that holds the component of the current route (path). -->
    <!-- NOTE: component can be rendered using both the opening and closing tags, or with only the closing tag. -->
    <router-outlet></router-outlet>
    <app-footer />
  </div>

  <!-- Modal feature -->
  <div ngClass="modal-backdrop" id="modal">
    <div ngClass="modal" id="modalContent"></div>
  </div>
  <div ngClass="toast" id="toast"></div>

</body>
</html>
